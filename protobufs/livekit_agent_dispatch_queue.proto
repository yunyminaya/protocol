syntax = "proto3";

package livekit;
option go_package = "github.com/livekit/protocol/livekit";
option csharp_namespace = "LiveKit.Proto";
option ruby_package = "LiveKit::Proto";

import "google/protobuf/timestamp.proto";
import "livekit_agent_dispatch.proto";
import "livekit_models.proto";
import "logger/options.proto";

// AgentDispatchQueue accepts dispatches to run later, as project capacity
// allows, instead of failing at the concurrency cap the way
// AgentDispatchService.CreateDispatch does. A queued job becomes a real
// AgentDispatch only once the queue admits it.
//
// Enqueue is a batch because the queue exists to take thousands of dispatches
// in one request and let admission control pace them against the project's
// remaining capacity.
//
// Implemented in cloud only; OSS livekit-server does not serve this service.
// The project is taken from the caller's credentials, never from the request.
service AgentDispatchQueue {
  rpc AddJobs(AddJobsRequest) returns (AddJobsResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc RemoveJob(RemoveJobRequest) returns (RemoveJobResponse);
  rpc RetryJobs(RetryJobsRequest) returns (RetryJobsResponse);

  // Group operations. The server returns Unimplemented for all five until the
  // group model lands (AP-976).
  rpc ListJobGroups(ListJobGroupsRequest) returns (ListJobGroupsResponse);
  rpc PauseJobGroup(PauseJobGroupRequest) returns (PauseJobGroupResponse);
  rpc ResumeJobGroup(ResumeJobGroupRequest) returns (ResumeJobGroupResponse);
  rpc CancelJobGroup(CancelJobGroupRequest) returns (CancelJobGroupResponse);
  rpc DeleteJobGroup(DeleteJobGroupRequest) returns (DeleteJobGroupResponse);

  rpc GetDispatchQueueConfig(GetDispatchQueueConfigRequest) returns (GetDispatchQueueConfigResponse);
  rpc UpdateDispatchQueueConfig(UpdateDispatchQueueConfigRequest) returns (UpdateDispatchQueueConfigResponse);
}

enum QueuedJobStatus {
  QUEUED_JOB_STATUS_UNSPECIFIED = 0;
  // Awaiting capacity, or waiting on start_after.
  QUEUED_JOB_STATUS_QUEUED = 1;
  // Admitted; CreateDispatch in flight.
  QUEUED_JOB_STATUS_DISPATCHING = 2;
  // Dispatch created, agent job live.
  QUEUED_JOB_STATUS_RUNNING = 3;
  QUEUED_JOB_STATUS_SUCCEEDED = 4;
  QUEUED_JOB_STATUS_FAILED = 5;
  // Removed, or cancelled with its group, before it was admitted.
  QUEUED_JOB_STATUS_CANCELLED = 6;
  // Still queued at expires_at; never dispatched. Includes a job whose
  // start_after never arrived before it expired.
  QUEUED_JOB_STATUS_EXPIRED = 7;
}

// What to dispatch. Mirrors CreateAgentDispatchRequest so that a queued job and
// an immediate dispatch describe the same work.
message QueuedJobInput {
  // Must match the agent_name registered by the agent server.
  string agent_name = 1;
  // Required. The queue does not invent room names; a caller wanting one room
  // per job supplies its own unique name.
  string room_name = 2;
  // Required, unique per project. Re-adding with the same key returns the
  // existing job rather than dispatching twice.
  string idempotency_key = 3;

  string metadata = 4 [(logger.sensitivity) = SENSITIVITY_PII];
  map<string, string> attributes = 5 [(logger.sensitivity) = SENSITIVITY_PII];
  string deployment = 6;
  JobRestartPolicy restart_policy = 7;

  // Never dispatch after this time; the job goes to EXPIRED instead. Capped at
  // 8 days out to stay inside the row retention window, which also bounds
  // start_after.
  optional google.protobuf.Timestamp expires_at = 8;
  // Callbacks for this job's terminal event, delivered in addition to any set
  // on its group and on the project. Same pattern as Egress per-request
  // webhooks. Reads clear signing_key, so a job read back carries its webhook
  // URLs but not their keys.
  repeated WebhookConfig webhooks = 9;

  // Hold the job until this time. A floor, not an appointment: the job still
  // waits on capacity once eligible, and eligibility only filters the FIFO
  // scan - order stays created_at, so a held job keeps its original place in
  // line. Must be before expires_at.
  optional google.protobuf.Timestamp start_after = 11;
}

message QueuedJob {
  string id = 1 [(logger.name) = "jobID"];
  optional string group_id = 2 [(logger.name) = "groupID"];
  QueuedJobStatus status = 3;
  QueuedJobInput input = 4;

  // Set once dispatch is invoked; the join point into the dispatch APIs.
  string dispatch_id = 5 [(logger.name) = "dispatchID"];
  // Set once the room is created.
  string room_id = 6 [(logger.name) = "roomID"];

  // JSON the agent writes back before exiting; opaque to the queue and carried
  // on the terminal webhook.
  string result = 7 [(logger.sensitivity) = SENSITIVITY_PII];
  // Set on FAILED, including exhaustion of infra retries.
  string error = 8;
  // Dispatch attempts made by the queue. Counts infra-level retries before a
  // dispatch succeeds, not agent-side failures.
  int32 attempts = 9;

  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp dispatched_at = 11;
  google.protobuf.Timestamp completed_at = 12;
}

message JobGroup {
  string id = 1 [(logger.name) = "groupID"];
  // A paused group admits nothing; jobs already in flight run to completion.
  bool paused = 2;
  google.protobuf.Timestamp created_at = 3;
  repeated StatusCount counts = 4;
  // Jobs from this group running at once, as set when the group was created.
  // Zero means the dispatcher default applies.
  uint32 concurrency_limit = 5;
  // As set when the group was created. signing_key is cleared here.
  repeated WebhookConfig webhooks = 6;

  // Proto3 forbids enum map keys, so counts by status are a repeated pair.
  message StatusCount {
    QueuedJobStatus status = 1;
    uint32 count = 2;
  }
}

// Which slice of the project's queued traffic a DispatchLimit applies to.
enum DispatchLimitScope {
  // Invalid. A limit must name its scope: proto3 cannot tell an unset field
  // from a deliberate zero, so a limit that omits one is rejected rather than
  // silently given the widest possible reach.
  DISPATCH_LIMIT_SCOPE_UNSPECIFIED = 0;
  // QueuedJobInput.agent_name.
  DISPATCH_LIMIT_SCOPE_AGENT = 1;
  // The project's whole queue.
  DISPATCH_LIMIT_SCOPE_PROJECT = 3;

  // 2 was a per-destination label scope, dropped before release.
  reserved 2;
}

// One limit over a slice of the project's queued traffic. A job is evaluated
// against every limit it matches and the smallest remaining budget wins.
// Per-group limits are set on the group instead, at AddJobsRequest.
//
// These bound what this queue admits. They do not bound sessions started
// outside it, including direct AgentDispatchService.CreateDispatch calls, so
// they are not a cap on an agent's total concurrency.
message DispatchLimit {
  DispatchLimitScope scope = 1;
  // Which value of the scoped attribute this limit covers. Empty with a scope
  // set means every distinct value gets its own budget of this size, so one
  // rule can cover all agents without enumerating them.
  string key = 2;

  // Jobs from this scope running at once. Zero leaves the scope uncapped.
  uint32 max_concurrent = 4;
  // Dispatch starts allowed per second. The scheduler releases the budget in
  // slices across admission rounds rather than at the top of each second. Zero
  // leaves the scope unrated.
  //
  // This also spreads completions, since jobs that start together finish
  // together. Capping it is usually cheaper than raising
  // DispatchQueueConfig.min_free_capacity to cover the same burst.
  uint32 max_starts_per_second = 5;
}

message DispatchQueueConfig {
  // The queue stops admitting while free project capacity would fall below
  // this. Everything else the project runs - sessions a user started, direct
  // AgentDispatchService.CreateDispatch calls, anything not from this queue -
  // draws on the same capacity, and this is what the queue leaves for it.
  //
  // The asymmetry is the point: a queued job that cannot get capacity waits,
  // which is what the queue is for. A request from anywhere else has nowhere
  // to wait - it fails with quota exceeded.
  //
  // Size it to how much that other work can GROW before capacity comes back,
  // not to how much of it runs - admission reads capacity REMAINING, so a
  // steady level of it already lowers what the queue takes. Capacity comes
  // back only as jobs finish: a dispatched job is never cancelled or paused,
  // so the queue cannot hand a slot back on demand.
  //
  // Job length and start spread therefore set the window this has to carry.
  // Jobs that start together finish together, so a batch of hour-long jobs
  // admitted at once frees nothing for an hour, and this floor has to absorb
  // every arrival in between; thirty-second jobs free capacity continuously
  // and need almost none. max_starts_per_second is the other half of this
  // knob, and usually the cheaper one: spreading starts spreads completions
  // and shortens the window, where raising it forces this floor up.
  uint32 min_free_capacity = 1;

  repeated DispatchLimit limits = 2;
}

message AddJobsRequest {
  // Up to 1,000 per request; clients loop to add more.
  repeated QueuedJobInput jobs = 1;
  // Attach every job in this request to a group, created on first use.
  optional string group_id = 2 [(logger.name) = "groupID"];
  // Jobs from this group to run at once. Applied when the group is created and
  // ignored on later adds to the same group. Zero means the dispatcher default
  // applies. Group limits live here rather than in DispatchQueueConfig because
  // groups are short-lived and would otherwise churn the project config.
  uint32 group_concurrency_limit = 3;
  // Callbacks for the terminal event of every job in this group, so a caller
  // adding a thousand jobs does not repeat the same URL on each. Applied when
  // the group is created and ignored on later adds, as above.
  //
  // Project, group and job callbacks all fire. A URL listed at more than one
  // level is delivered to once, using the most specific entry: job, then
  // group, then project.
  repeated WebhookConfig group_webhooks = 4;
}

message AddJobsResponse {
  // Same order and length as the request. Validation is atomic: if any input
  // is invalid nothing is enqueued and the error enumerates every bad entry,
  // so a rejected batch is safe to fix and resend in one pass. An input whose
  // idempotency_key already existed yields the pre-existing job unchanged.
  repeated QueuedJob jobs = 1;
}

message GetJobRequest {
  string job_id = 1 [(logger.name) = "jobID"];
}

message GetJobResponse {
  QueuedJob job = 1;
}

message ListJobsRequest {
  optional string group_id = 1 [(logger.name) = "groupID"];
  optional QueuedJobStatus status = 2;
  optional TokenPagination page_token = 3;
  optional int32 page_size = 4;
}

message ListJobsResponse {
  repeated QueuedJob jobs = 1;
  TokenPagination next_page_token = 2;
}

// Cancels a job that has not been admitted yet (QUEUED -> CANCELLED). A job
// already DISPATCHING or RUNNING is left alone; tear down the live session
// through DeleteDispatch or the room APIs instead.
message RemoveJobRequest {
  string job_id = 1 [(logger.name) = "jobID"];
}

message RemoveJobResponse {}

// Re-queues jobs in a FAILED or EXPIRED state, reusing their rows and
// idempotency keys instead of minting new jobs. Jobs in any other state are
// returned untouched.
message RetryJobsRequest {
  repeated string job_ids = 1 [(logger.name) = "jobIDs"];
  // Replaces expires_at on the retried jobs.
  optional google.protobuf.Timestamp expires_at = 2;
  // Replaces start_after on the retried jobs, to hold a retry back rather than
  // re-queueing it immediately. Unset clears any start_after the job carried,
  // since the original hold has already elapsed.
  optional google.protobuf.Timestamp start_after = 3;
}

message RetryJobsResponse {
  repeated QueuedJob jobs = 1;
}

message ListJobGroupsRequest {
  optional TokenPagination page_token = 1;
  optional int32 page_size = 2;
}

message ListJobGroupsResponse {
  repeated JobGroup groups = 1;
  TokenPagination next_page_token = 2;
}

// An unset group_id pauses the project's whole queue, grouped and ungrouped
// jobs alike.
message PauseJobGroupRequest {
  optional string group_id = 1 [(logger.name) = "groupID"];
}

message PauseJobGroupResponse {}

// An unset group_id resumes the project's whole queue.
message ResumeJobGroupRequest {
  optional string group_id = 1 [(logger.name) = "groupID"];
}

message ResumeJobGroupResponse {}

// Cancels the queued jobs in the group; jobs already in flight run to
// completion.
//
// group_id is required. Pause and resume take an empty one because freezing a
// queue is reversible; emptying one is not, so there is no project-wide form
// of this call to reach by leaving a field out.
message CancelJobGroupRequest {
  string group_id = 1 [(logger.name) = "groupID"];
}

message CancelJobGroupResponse {}

// Cancels the remaining queued jobs and hides the group and its terminal jobs
// from listings. Rows are kept for the retention window. group_id is required,
// for the reason it is on CancelJobGroup.
message DeleteJobGroupRequest {
  string group_id = 1 [(logger.name) = "groupID"];
}

message DeleteJobGroupResponse {}

message GetDispatchQueueConfigRequest {}

message GetDispatchQueueConfigResponse {
  DispatchQueueConfig config = 1;
}

// Replaces the stored config wholesale, so an omitted limit is a removed
// limit. Read-modify-write to change one field.
message UpdateDispatchQueueConfigRequest {
  DispatchQueueConfig config = 1;
}

message UpdateDispatchQueueConfigResponse {
  DispatchQueueConfig config = 1;
}
